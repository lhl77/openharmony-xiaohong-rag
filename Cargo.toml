[package]
name = "xiaohong-rag"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Local dual-channel retrieval and citation engine for Xiaohong on OpenHarmony"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-segmentation = "1"

[dev-dependencies]
proptest = "1"
